    <path d="M170 -18 q30 -30 60 0" fill="none" stroke="url(#leafGrad)" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="150" cy="200" rx="60" ry="70" fill="#ffffff" opacity="0.12"/>
    <ellipse cx="250" cy="220" rx="46" ry="56" fill="#ffffff" opacity="0.1"/>
