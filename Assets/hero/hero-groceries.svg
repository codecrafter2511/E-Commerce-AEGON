<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Fresh grocery basket illustration</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4d3c"/>
      <stop offset="100%" stop-color="#0d2e22"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c58b"/>
      <stop offset="100%" stop-color="#12946a"/>
    </linearGradient>
    <linearGradient id="tomatoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#f0563a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee6b0"/>
      <stop offset="100%" stop-color="#2fbf82"/>
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#bgGrad)"/>
